<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Academic homepage of Xuheng Cao — computational imaging, hyperspectral reconstruction, and traceable thermometry." />
  <meta name="theme-color" content="#050507" />
  <title>Xuheng Cao · Computational Imaging</title>
  <link rel="stylesheet" href="style-1.css" />
  <link rel="stylesheet" href="style-2.css" />
  <link rel="stylesheet" href="style-3.css" />
</head>
<body>
  <div id="site-root" aria-live="polite"></div>
  <noscript>This academic homepage requires JavaScript to display its interactive content.</noscript>
  <script>
    (async () => {
      const root = document.getElementById("site-root");
      try {
        const files = ["content-1.html", "content-2.html", "content-3.html"];
        const responses = await Promise.all(files.map(file => fetch(file)));
        if (responses.some(response => !response.ok)) throw new Error("Content request failed");
        root.outerHTML = (await Promise.all(responses.map(response => response.text()))).join("");
        const script = document.createElement("script");
        script.src = "app.js";
        document.body.appendChild(script);
      } catch (error) {
        root.innerHTML = '<main style="max-width:760px;margin:120px auto;padding:24px;font-family:system-ui;color:#f5f5f7"><h1>Xuheng Cao</h1><p>The page could not load its content. Please refresh the browser.</p></main>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
